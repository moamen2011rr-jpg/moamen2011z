name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare adhan audio resource
        run: |
          mkdir -p app/src/main/res/raw
          cp e9bb86af0d30.mp3 app/src/main/res/raw/adhan.mp3
      - name: Remove misplaced upload files
        run: |
          find app/src/main/res/layout -type f ! -name '*.xml' -delete
          find app/src/main/res/layout/app -type f -delete 2>/dev/null || true
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PrayerTimes.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrayerTimes
          path: PrayerTimes.apk
          if-no-files-found: error
